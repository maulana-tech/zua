<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zua widget demo</title>
<style>
  :root { color-scheme: light; --ink: #151310; --paper: #faf7f0; --ash: #6b665c; }
  body { margin: 0; font: 16px/1.55 system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  .card { background: #fff; border: 1px solid #e7e1d4; border-radius: 20px; padding: 24px; margin-top: 20px; }
  .muted { color: var(--ash); font-size: 14px; }
  #log { font: 13px/1.5 ui-monospace, monospace; background: #f2eee4; border-radius: 12px; padding: 12px; min-height: 48px; white-space: pre-wrap; }
  code { background: #f2eee4; padding: 1px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <p class="muted">Demo shop · not a real store</p>
  <h1>Hand-ground coffee, 250 g</h1>
  <p>This is any website. It added Zua with one <code>&lt;script&gt;</code> tag. The payment
    goes straight from the buyer's Zcash wallet to the seller's shielded address: this page
    never sees the amount, the buyer or the seller's balance.</p>

  <div class="card">
    <div id="zua-slot" data-zua-pay></div>
    <p class="muted">Events from the widget:</p>
    <div id="log"></div>
  </div>
</main>
<script>
  // Configure the widget from the query string (?to=dinar&link=…), as the
  // dashboard's "Try it" link does.
  const params = new URLSearchParams(location.search);
  const slot = document.getElementById("zua-slot");
  for (const key of ["to", "link", "invoice", "amount", "mode", "theme", "label"]) {
    const value = params.get(key);
    if (value) slot.dataset[key] = key === "to" ? `@${value.replace(/^@/, "")}` : value;
  }
  if (!slot.dataset.to && !slot.dataset.invoice)
    slot.textContent = "Add ?to=<username> to this page's URL to try the widget.";
  const log = document.getElementById("log");
  for (const type of ["zua:ready", "zua:payer-says-paid", "zua:paid", "zua:close"])
    document.addEventListener(type, (e) => {
      log.textContent += `${new Date().toLocaleTimeString()}  ${type} ${JSON.stringify(e.detail)}\n`;
    });
</script>
<script src="/embed.js" async></script>
</body>
</html>
