[target.wasm32-unknown-unknown]
# Recent nightlies no longer imply a shared memory from +atomics; threads
# (rayon proving, sync worker) need it spelled out (see wasm-bindgen-rayon).
rustflags = [
    "-C", "target-feature=+atomics,+bulk-memory,+mutable-globals",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--max-memory=4294967296",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
    "--cfg", "getrandom_backend=\"wasm_js\"",
]

[env]
# C code linked into the wasm (SQLite via sqlite-wasm-rs) must match the
# shared memory above.
CFLAGS_wasm32_unknown_unknown = "-matomics -mbulk-memory"
